<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Gold Mines — Referensi Komponen</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2e3d;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #2563eb;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    padding: 16px;
    max-width: 720px;
    margin: 0 auto;
  }
  header { padding: 20px 0 8px; }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }
  h2 {
    font-size: 1.15rem;
    font-weight: 700;
    margin: 32px 0 12px;
    padding: 10px 14px;
    background: var(--card);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
  }
  h3 { font-size: 1rem; font-weight: 600; margin: 20px 0 8px; color: var(--text); }
  p { margin-bottom: 10px; color: var(--muted); }
  a { color: var(--accent); text-decoration: none; word-break: break-all; }
  a:active { opacity: 0.7; }
  ul, ol { margin: 8px 0 14px 20px; color: var(--muted); }
  li { margin-bottom: 6px; }
  li::marker { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; margin: 10px 0 16px; font-size: 0.85rem; }
  th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--card); color: var(--text); font-weight: 600; }
  td { color: var(--muted); }
  code {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 0.85em;
    color: var(--green);
  }
  pre {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    overflow-x: auto;
    margin: 10px 0;
  }
  pre code { background: none; border: none; color: var(--text); }
  blockquote {
    border-left: 3px solid var(--accent);
    padding-left: 12px;
    margin: 10px 0;
    color: var(--muted);
  }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 600;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .section-note { background: var(--card); border-radius: var(--radius); padding: 14px; margin: 16px 0; font-size: 0.85rem; color: var(--muted); }
  footer { margin: 40px 0 24px; text-align: center; color: var(--muted); font-size: 0.75rem; }
  @media (max-width: 480px) {
    body { padding: 12px; }
    h1 { font-size: 1.3rem; }
    table { font-size: 0.78rem; }
    th, td { padding: 6px 8px; }
  }
</style>
</head>
<body>
<header>
  <h1>🎨 UI Gold Mines</h1>
  <p class="sub">Koleksi referensi komponen UI & AI-native interfaces — di-update 2026-08-12</p>
</header>
<div id="content"><!-- content --></div>
<footer>Dibuat untuk Rafi · dari WSL Hermes · <a href="https://github.com/RafiAkem/RafiAkem.github.io">repo</a></footer>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const FILES = {
  "beautiful-ui": "https://raw.githubusercontent.com/RafiAkem/RafiAkem.github.io/master/ui-refs/beautiful-ui.md",
  "gold-mines": "https://raw.githubusercontent.com/RafiAkem/RafiAkem.github.io/master/ui-refs/gold-mines.md"
};
const order = ["gold-mines", "beautiful-ui"];
const titles = { "gold-mines": "Semua Gold Mine", "beautiful-ui": "Beautiful UI (detail)" };
async function load() {
  const sections = [];
  for (const key of order) {
    try {
      const res = await fetch(FILES[key]);
      if (!res.ok) throw new Error(res.status);
      const md = await res.text();
      sections.push(`<h2 style="margin-top:40px">📁 ${titles[key]}</h2>` + marked.parse(md));
    } catch (e) {
      sections.push(`<div class="section-note">⚠️ Gagal load ${key} (${e.message})</div>`);
    }
  }
  document.getElementById('content').innerHTML = sections.join('');
}
load();
</script>
</body>
</html>
